<section class="content-header">
    <div class="container-fluid">
        <div class="header d-flex justify-content-between align-items-center">
            <div class="breadcrumb">
                <app-bread-crumb
                    [listBreadCrumb]="listBreadCrumb"
                    (refreshCurrentPage)="onRefreshCurrentPage()"
                    ></app-bread-crumb>
            </div>
            <div class="col-6 text-right"></div>
        </div>
    </div>
</section>

<section class="content px-2" id="revenue-report">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header align-items-center">
                <div class="row align-items-center h-fit-content">
                    <div class="col-4">
                        <mat-form-field appearance="outline" class="col-12">
                            <input
                                type="text"
                                matInput
                                class="form-control height-maxcontent"
                                name="revenue-count"
                                placeholder="Tìm kiếm theo nội dung..."
                                [(ngModel)]="searchText"
                                (keyup.enter)="onSearch()"
                            />
                        </mat-form-field>
                    </div>
                    <div class="col-2 d-flex align-items-center">
                        <app-tree-in-out-type
                            #treeInOutType
                            [filter]="treeInOutTypeOption"
                            [ngClass]="incomingEntryTypeIds.length > 0 ? 'col-11' : 'col-12'"
                            [selected]="incomingEntryTypeIds"
                            (selectChange)="incomingEntryTypeIds = $event; onListIncomeTypeFilter()"
                            placeholderSearch="Search loại thu"
                            [isRequired]="false"
                            placeholder="Loại thu"
                            [undefinedValue]="[]"
                            label="Loại thu"
                        >
                        </app-tree-in-out-type>
                        <i 
                            class="fas fa-times fa-lg pointer"
                            *ngIf="incomingEntryTypeIds.length > 0"
                            (click)="onCancelFilterListIncomeType()"
                        ></i>
                    </div>
                    <div class="col-6">
                        <app-date-selector
                            (onDateSelectorChange)="onDateChange($event)"
                            [type]="defaultDateFilterType"
                            [defaultDateFilter]="searchWithDateTime"
                            [label]="'Ngày giao dịch'"
                        ></app-date-selector>
                    </div>
                </div>
                <div class="row align-items-center h-fit-content mt-2">
                    <div class="col-2 d-flex align-items-center">
                        <mat-form-field class="col-12" appearance="outline">
                        <mat-label>Id</mat-label>
                        <input
                            type="text"
                            matInput
                            class="form-control height-maxcontent"
                            name="id"
                            mask="separator"
                            placeholder="Tìm kiếm theo Id"
                            thousandSeparator=""
                            [(ngModel)]="searchId"
                            (keyup.enter)="onFilterId()"
                        />
                        </mat-form-field>
                    </div>
                    <div class="col-2">
                        <custome-select
                        (onSelect)="onClientSelect($event)"
                        className="col-12"
                        [dropdownData]="listClient"
                        [label]="'Khách hàng'"
                        [defaultValue]="selectedClient"
                        [placeholder]="'Khách hàng'"
                        ></custome-select>
                    </div>
                    <div class="col-2 d-flex align-items-center">
                        <mat-form-field class="col-12" appearance="outline">
                        <mat-label>Số tiền bằng</mat-label>
                        <input
                            type="text"
                            matInput
                            class="form-control height-maxcontent"
                            name="money"
                            placeholder="Nhập số tiền"
                            [(ngModel)]="searchMoney"
                            mask="separator"
                            thousandSeparator=","
                            (keyup.enter)="onFilterMoney()"
                        />
                        </mat-form-field>
                    </div>
                    <div class="col-2">
                        <mat-form-field class="col-12" appearance="outline">
                        <mat-label>Tính vào doanh thu</mat-label>
                        <mat-select
                            [(ngModel)]="searchRevenueCounted"
                            (selectionChange)="onRevenueCountedFilter()"
                        >
                            <mat-option [value]="-1"> All </mat-option>
                            <mat-option [value]="1"> Có tính vào doanh thu </mat-option>
                            <mat-option [value]="0"> Không tính vào doanh thu </mat-option>
                        </mat-select>
                        </mat-form-field>
                    </div>
                    <div class="col-2 d-flex align-items-center">
                        <mat-form-field class="col-12" appearance="outline">
                        <mat-label>Loại tiền</mat-label>
                        <mat-select
                            [(ngModel)]="searchCurrency"
                            (selectionChange)="onCurrencyFilter()"
                            name="currencyFilter"
                        >
                            <ng-container *ngFor="let item of listCurrency">
                            <mat-option [value]="item.id">
                                {{ item.name }}
                            </mat-option>
                            </ng-container>
                        </mat-select>
                        </mat-form-field>
                    </div>
                    <div class="col-2 d-flex align-items-center">
                        <div class="action-revenue-recording col-12">
                        <button
                            class="action-item"
                            mat-raised-button
                            (click)="handleClearFilter()"
                        >
                            Clear
                        </button>
                        <button
                            class="action-item bg-blue"
                            mat-raised-button
                            (click)="applyFiltersAndLoadTree()"
                            color="primary"
                        >
                            Search
                        </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body pt-0">
                <mat-accordion>
                    <app-revenue-report-list
                        *ngFor="let node of treeData"
                        [node]="node"
                        [filterRequest]="buildTreeRequestFromFilters()"
                        [resetVersion]="resetVersion">
                    </app-revenue-report-list>
                </mat-accordion>
            </div>
        </div>
    </div>
</section>
